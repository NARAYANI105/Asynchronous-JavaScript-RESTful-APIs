<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f172a,#1e293b,#0ea5e9,#6366f1);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
overflow:hidden;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.bubble{
position:absolute;
border-radius:50%;
background:rgba(255,255,255,.1);
backdrop-filter:blur(5px);
animation:float 15s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh) scale(0);
}
100%{
transform:translateY(-120vh) scale(1);
}
}

.container{
width:95%;
max-width:900px;
padding:30px;
border-radius:30px;
background:rgba(255,255,255,.1);
backdrop-filter:blur(25px);
box-shadow:0 20px 60px rgba(0,0,0,.3);
color:white;
animation:fadeIn 1s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(50px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.title{
text-align:center;
font-size:2.5rem;
font-weight:700;
margin-bottom:25px;
}

.search-box{
display:flex;
gap:15px;
margin-bottom:30px;
}

.search-box input{
flex:1;
padding:15px;
border:none;
outline:none;
border-radius:15px;
font-size:16px;
transition:.4s;
}

.search-box input:focus{
transform:scale(1.03);
}

.search-box button{
padding:15px 25px;
border:none;
border-radius:15px;
cursor:pointer;
font-weight:600;
background:#fff;
transition:.4s;
}

.search-box button:hover{
transform:translateY(-5px) scale(1.05);
}

.loading{
display:none;
text-align:center;
font-size:18px;
margin-top:10px;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{
opacity:.4;
}
}

.weather{
display:none;
animation:slideUp .8s ease;
}

@keyframes slideUp{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.city{
text-align:center;
font-size:2rem;
font-weight:600;
margin-bottom:10px;
}

.time{
text-align:center;
margin-bottom:25px;
opacity:.8;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;
}

.card{
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(10px);
text-align:center;
transition:.4s;
}

.card:hover{
transform:translateY(-10px) scale(1.05);
}

.card h3{
font-size:16px;
margin-bottom:10px;
}

.card p{
font-size:28px;
font-weight:700;
}

.error{
display:none;
text-align:center;
padding:15px;
margin-top:15px;
background:rgba(255,0,0,.2);
border-radius:12px;
}

.icon{
font-size:70px;
text-align:center;
margin-bottom:20px;
animation:bounce 2s infinite;
}

@keyframes bounce{
50%{
transform:translateY(-10px);
}
}

</style>
</head>
<body>

<div class="bubble" style="width:100px;height:100px;left:10%;animation-duration:20s;"></div>
<div class="bubble" style="width:70px;height:70px;left:30%;animation-duration:18s;"></div>
<div class="bubble" style="width:120px;height:120px;left:60%;animation-duration:25s;"></div>
<div class="bubble" style="width:90px;height:90px;left:80%;animation-duration:22s;"></div>

<div class="container">

<div class="title">
Weather Dashboard
</div>

<div class="search-box">
<input type="text" id="cityInput" placeholder="Enter City Name">
<button onclick="getWeather()">Search</button>
</div>

<div class="loading" id="loading">
Loading Weather...
</div>

<div class="error" id="error"></div>

<div class="weather" id="weather">

<div class="icon" id="icon">☀️</div>

<div class="city" id="city"></div>

<div class="time" id="time"></div>

<div class="cards">

<div class="card">
<h3>Temperature</h3>
<p id="temp">--</p>
</div>

<div class="card">
<h3>Humidity</h3>
<p id="humidity">--</p>
</div>

<div class="card">
<h3>Wind Speed</h3>
<p id="wind">--</p>
</div>

<div class="card">
<h3>Weather</h3>
<p id="condition">--</p>
</div>

</div>

</div>

</div>

<script>

const weatherCodes={
0:"Clear Sky",
1:"Mainly Clear",
2:"Partly Cloudy",
3:"Cloudy",
45:"Fog",
48:"Fog",
51:"Drizzle",
61:"Rain",
63:"Rain",
65:"Heavy Rain",
71:"Snow",
80:"Rain Showers",
95:"Thunderstorm"
};

function getIcon(code){

if(code===0) return "☀️";
if(code<=3) return "⛅";
if(code===45||code===48) return "🌫️";
if(code>=51&&code<=67) return "🌧️";
if(code>=71&&code<=77) return "❄️";
if(code>=80&&code<=82) return "🌦️";
if(code>=95) return "⛈️";

return "🌤️";
}

async function getWeather(){

const city=document.getElementById("cityInput").value.trim();

const loading=document.getElementById("loading");
const error=document.getElementById("error");
const weather=document.getElementById("weather");

error.style.display="none";
weather.style.display="none";

if(!city){
error.style.display="block";
error.innerText="Please enter a city name";
return;
}

loading.style.display="block";

try{

const geoRes=await fetch(
`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`
);

if(!geoRes.ok){
throw new Error("Geocoding failed");
}

const geoData=await geoRes.json();

if(!geoData.results || geoData.results.length===0){
throw new Error("City not found");
}

const place=geoData.results[0];

const lat=place.latitude;
const lon=place.longitude;

const weatherRes=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code`
);

if(!weatherRes.ok){
throw new Error("Weather fetch failed");
}

const data=await weatherRes.json();

const current=data.current;

document.getElementById("city").innerText=
`${place.name}, ${place.country}`;

document.getElementById("temp").innerText=
current.temperature_2m+"°C";

document.getElementById("humidity").innerText=
current.relative_humidity_2m+"%";

document.getElementById("wind").innerText=
current.wind_speed_10m+" km/h";

document.getElementById("condition").innerText=
weatherCodes[current.weather_code] || "Unknown";

document.getElementById("icon").innerText=
getIcon(current.weather_code);

document.getElementById("time").innerText=
new Date().toLocaleString();

weather.style.display="block";

}
catch(err){

error.style.display="block";
error.innerText=err.message;

}
finally{

loading.style.display="none";

}

}

document.getElementById("cityInput")
.addEventListener("keypress",function(e){

if(e.key==="Enter"){
getWeather();
}

});

</script>

</body>
</html>
